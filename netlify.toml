# Starfetch Investment Limited — Netlify configuration
# Static site, published from the repository root.

[build]
  publish = "."

# Security headers. These are checked by the SEC technology-audit control
# checklist (ISO 27001 / NIST CSF aligned) referenced in the Technology Plan §5.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Static assets can be cached hard; HTML must not be, so edits appear immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Internal working documents live in this repository but must not be served to
# the public. Each returns the branded 404 page.
[[redirects]]
  from = "/CHANGELOG.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PUBLISHING.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY_GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EDITING_GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/publish.sh"
  to = "/404.html"
  status = 404
  force = true
