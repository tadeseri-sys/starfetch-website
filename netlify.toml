# Starfetch Investment Limited — Netlify configuration
# Static site, published from the repository root.

[build]
  publish = "."

# Security headers. These are checked by the SEC technology-audit control
# checklist (ISO 27001 / NIST CSF aligned) referenced in the Technology Plan §5.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Static assets can be cached hard; HTML must not be, so edits appear immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# EXCEPTION: /assets/data/ holds published figures, not static assets. The rule
# above cached them for seven days, so a rate corrected today could still be
# served stale for a week after the deploy - which for a regulated firm's
# published rates is worse than the staleness it hides, because it is invisible.
# Revalidate every five minutes instead. Keep this rule below the /assets/* rule.
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# EXCEPTION: the stylesheet and the page script carry fixes, and they were caught
# by the seven-day rule too - so on 26 Aug 2026 the very fix that stops figures
# being cached was itself sitting in a cached file and could not take effect for
# a week. Their URLs now carry a ?v= version bumped whenever they change, which
# is what actually busts the cache; this hour-long TTL is the safety net for when
# someone forgets to bump it. Images and fonts keep the seven-day rule above.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Internal working documents live in this repository but must not be served to
# the public. Each returns the branded 404 page.
[[redirects]]
  from = "/CHANGELOG.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PUBLISHING.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOY_GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EDITING_GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/publish.sh"
  to = "/404.html"
  status = 404
  force = true
